\* The handshake as it was before it compared epochs: a device is believed about where it had
\* reached, whatever history it counted there.
\*
\* Expected to violate Consistent. The server loses what it was keeping and starts the scope again
\* from zero. A device that had reached sequence 3 in the run before still holds its rows and still
\* holds the number 3, and nothing on the wire distinguishes "there is nothing after 3" from "3 was
\* never written". Its next pull is incremental, carries nothing, leaves its cursor where it was —
\* `applyPull` only ever raises it — and it goes on showing rows the scope no longer has, believing
\* it is current.
\*
\* One row and one device is enough. The second device exists to write to the replacement scope, so
\* the counterexample shows the two disagreeing rather than one device alone with a stale view.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1}
    MaxSeq = 3
    MaxEpoch = 2
    PullChecksFloor = TRUE
    FloorRisesFirst = TRUE
    AckReportsSupersession = TRUE
    HandshakeChecksEpoch = FALSE

INVARIANT TypeOK
INVARIANT Consistent
INVARIANT FieldConsistent

SYMMETRY Symmetry
