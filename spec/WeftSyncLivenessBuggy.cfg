\* Liveness on the protocol without the floor check, with safety deliberately not asserted so
\* the temporal property is what fails rather than the invariant.
\*
\* TLC is expected to report "Temporal properties were violated" here. That is the point: a
\* liveness property that passes on a protocol known to be broken is checking nothing, which
\* is exactly the trap an earlier version of this specification fell into by putting weak
\* fairness on the whole next-state relation.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1}
    MaxSeq = 3
    MaxEpoch = 1
    PullChecksFloor = FALSE
    FloorRisesFirst = TRUE
    AckReportsSupersession = TRUE
    HandshakeChecksEpoch = TRUE

INVARIANT TypeOK

PROPERTY EventuallyConsistent
