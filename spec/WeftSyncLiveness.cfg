\* Liveness at smaller bounds: devices that keep pulling, pushing and repairing stop
\* disagreeing and stay that way.
\*
\* No SYMMETRY: symmetry reduction is unsound for temporal properties. One row is enough —
\* the property is about a device catching up, which does not need a second row to express.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1}
    MaxSeq = 3
    PullChecksFloor = TRUE
    FloorRisesFirst = TRUE
    AckReportsSupersession = TRUE

INVARIANT TypeOK
INVARIANT Consistent
INVARIANT FieldConsistent

PROPERTY EventuallyConsistent
