\* The pull path as it was before it consulted the tombstone floor. TLC is expected to report
\* a Consistent violation: a purged row strands on a device that believes it is caught up.
\* This configuration exists so the specification is known to have teeth — a spec that cannot
\* fail proves nothing.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1, r2}
    MaxSeq = 5
    \* One epoch: the server keeps its history here, so this configuration fails on the floor.
    MaxEpoch = 1
    PullChecksFloor = FALSE
    FloorRisesFirst = TRUE
    AckReportsSupersession = TRUE
    HandshakeChecksEpoch = TRUE

INVARIANT TypeOK
INVARIANT Consistent

SYMMETRY Symmetry
