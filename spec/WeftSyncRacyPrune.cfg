\* Pruning that removes records before raising the floor. The floor check on the pull path is
\* still enabled, and TLC is still expected to report a Consistent violation: a reader landing
\* between the two steps sees the records gone and the floor still low.
\*
\* The implementation raises the floor first for exactly this reason. Single-threaded
\* JavaScript cannot interleave the two steps today, so this is a guard on the design rather
\* than a live defect — it fails the moment prune runs against a real database or the server
\* handles requests concurrently.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1, r2}
    MaxSeq = 5
    MaxEpoch = 1
    PullChecksFloor = TRUE
    FloorRisesFirst = FALSE
    AckReportsSupersession = TRUE
    HandshakeChecksEpoch = TRUE

INVARIANT TypeOK
INVARIANT Consistent

SYMMETRY Symmetry
