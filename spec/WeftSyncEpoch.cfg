\* The handshake as it ships, against a server that loses what it was keeping.
\*
\* Expected to hold. A device whose epoch is not the server's is told to resync before it reads or
\* pushes, so it takes a snapshot and adopts the head it finds rather than keeping the higher of the
\* two numbers.
\*
\* Small bounds, for the reason the liveness configuration has small bounds: a lost history sends
\* the search back over the whole space against a fresh server, and the full model does not finish.
\* One row is enough — the invariant is per row, and what is being checked is whether a device ever
\* believes it is current while holding a row the scope does not have.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1}
    MaxSeq = 3
    MaxEpoch = 2
    PullChecksFloor = TRUE
    FloorRisesFirst = TRUE
    AckReportsSupersession = TRUE
    HandshakeChecksEpoch = TRUE

INVARIANT TypeOK
INVARIANT Consistent
INVARIANT FieldConsistent

SYMMETRY Symmetry
