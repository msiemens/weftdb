\* Safety over the full model: local work, push and its rejections, quarantine and repair,
\* delete and restore, two-phase pruning, incremental pull and snapshot resync.
\*
\* Liveness lives in WeftSyncLiveness.cfg at smaller bounds — temporal checking explores the
\* same space again looking for cycles, which is what costs, not the state count itself.
SPECIFICATION Spec

\* MaxSeq bounds the scope counter, and so the length of a history. Both broken configurations
\* violate safety at two, so two is where this one still has teeth. Three ran to 70,782,790
\* distinct states in 56 minutes without finishing, once quarantine started carrying what was
\* refused and a snapshot started settling the liveness of a row a device holds work for.
CONSTANTS
    Devices = {d1, d2}
    Rows = {r1, r2}
    MaxSeq = 2
    \* One epoch. A lost history re-explores the whole space against a fresh server, which took
    \* this configuration past 7.5 million distinct states with the queue still growing.
    \* WeftSyncEpoch.cfg checks that half at bounds it can finish at, the way liveness does.
    MaxEpoch = 1
    PullChecksFloor = TRUE
    FloorRisesFirst = TRUE
    AckReportsSupersession = TRUE
    HandshakeChecksEpoch = TRUE

INVARIANT TypeOK
INVARIANT Consistent
INVARIANT FieldConsistent

SYMMETRY Symmetry
