\* The push path as it is when the ack for a field write says only that the transaction was
\* taken. TLC is expected to report a FieldConsistent violation: a device pushes a write whose
\* stamp loses, the server stores nothing and moves no sequence number, the device drops the
\* acknowledged op from its outbox, and the record that beat it sits below that device's cursor
\* where no incremental batch will ever mention it again. The device is caught up, holds
\* nothing pending, and holds a value the scope does not have.
\*
\* One row and one field are enough — the property is about a single losing write. `Consistent`
\* is asserted alongside because the row-level protocol is unmodified here and should still
\* hold; the field property is the one that fails.
SPECIFICATION Spec

CONSTANTS
    Devices = {d1, d2}
    Rows = {r1}
    MaxSeq = 3
    MaxEpoch = 1
    PullChecksFloor = TRUE
    FloorRisesFirst = TRUE
    AckReportsSupersession = FALSE
    HandshakeChecksEpoch = TRUE

INVARIANT TypeOK
INVARIANT Consistent
INVARIANT FieldConsistent
