name: Soak

# The property suites, run over and over on fresh draws. The ordinary suite runs each property a
# few hundred times against whatever fast-check happens to generate; this keeps drawing until the
# budget runs out, which is how the histories nobody thought of get reached.
#
# Deliberately unseeded. `WEFT_PROPERTY_SEED` is pinned for mutation runs, where per-test coverage
# needs a test to touch the same lines twice — pinning it here would defeat the entire point.
on:
  schedule:
    # Mondays, early. Not on the hour: scheduled jobs queue behind everyone else's.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep drawing new histories."
        required: false
        default: "30"
      world_runs:
        description: "Cases per generated-history property."
        required: false
        default: "3000"
      scenario_runs:
        description: "Cases per scenario property."
        required: false
        default: "1500"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Draw histories until the budget runs out
        env:
          MINUTES: ${{ inputs.minutes || '30' }}
          WEFT_WORLD_RUNS: ${{ inputs.world_runs || '3000' }}
          WEFT_SCENARIO_RUNS: ${{ inputs.scenario_runs || '1500' }}
          WEFT_PROPERTY_RUNS: "5000"
        run: |
          budget=$(( MINUTES * 60 ))
          round=0
          while [ "$SECONDS" -lt "$budget" ]; do
            round=$(( round + 1 ))
            echo "── round ${round}, $(( (budget - SECONDS) / 60 )) minutes left"
            # Each round is a fresh process, so every property draws from a new seed. A failure
            # ends the job immediately: the counterexample and its seed are in the log above, and
            # nothing is learned by drawing over a known failure.
            pnpm exec vitest run tests/property-*.test.ts tests/exhaustive-model.test.ts || exit 1
          done
          echo "completed ${round} rounds without a counterexample"

      - name: How to reproduce a failure
        if: ${{ failure() }}
        run: |
          echo "fast-check prints the seed and the shrunk counterexample with the failure above."
          echo "Replay it locally with:"
          echo "  WEFT_PROPERTY_SEED=<seed> pnpm test"
