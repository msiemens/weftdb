name: Mutation

# Never automatic. A full sweep is a few thousand mutants and hours of runner time, so it is
# asked for rather than triggered by a push.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "One source file to mutate, or empty to sweep all of them."
        required: false
        default: ""
      workers:
        description: "Stryker workers per job. A runner has 4 vCPU; more than 2 oversubscribes and turns slow mutants into false timeouts."
        required: false
        default: "2"

jobs:
  # One job per source file, because a job is capped at six hours and the whole sweep is not.
  # An empty `target` runs the whole matrix; naming one file runs that entry alone.
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      # One target failing is not a reason to abandon the rest: each file's score stands alone.
      fail-fast: false
      matrix:
        target:
          - packages/weftdb/src/core.ts
          - packages/weftdb/src/client/index.ts
          - packages/weftdb/src/server/index.ts
          - packages/weftdb/src/schema.ts
          - packages/weftdb/src/codegen/index.ts
          - packages/weftdb/src/client/sqlite.ts
          - packages/weftdb/src/client/subscriptions.ts
          - packages/weftdb/src/client/multitab.ts
          - packages/weftdb/src/server/relay.ts
          - packages/weftdb/src/server/serve.ts
          - packages/weftdb/src/server/jwt.ts
          - packages/weftdb/src/server/snapshot.ts
          - packages/weftdb/src/server/websocket.ts
          - packages/weftdb/src/server/websocket-frames.ts

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Through the environment rather than interpolated into the command: `workers` is whatever
      # the person who pressed the button typed, and `${{ }}` would hand it to the shell.
      - name: Mutate ${{ matrix.target }}
        if: ${{ inputs.target == '' || inputs.target == matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          WORKERS: ${{ inputs.workers }}
        run: pnpm exec stryker run --mutate "$TARGET" --concurrency "$WORKERS" --reporters html,clear-text

      # Uploaded even when the run failed: the report is the thing worth reading either way.
      - name: Upload report
        if: ${{ !cancelled() && (inputs.target == '' || inputs.target == matrix.target) }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/mutation
          retention-days: 14
          if-no-files-found: ignore
